server:
  port: 8082

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/studyhub

      client:
        registration:
          media-service:
            provider: keycloak
            client-id: course-service
            client-secret: ${COURSE_SERVICE_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            
        provider:
          keycloak:
            token-uri: http://localhost:8181/realms/studyhub/protocol/openid-connect/token

  cloud:
    openfeign:
      oauth2:
        enabled: true
        clientRegistrationId: media-service 
  
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB
      
  datasource:
    url: jdbc:mysql://localhost:3306/online_study_course_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info