server:
  port: 8080

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true



eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  routes:
   - id: user-service
     uri: lb://USER-SERVICE
     predicates:
     - Path=/api/v1/users/**

   

