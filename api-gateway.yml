server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v1/users/**

            - id: media-service
              uri: lb://MEDIA-SERVICE
              predicates:
                - Path=/api/v1/media/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 520MB

            - id: course-service
              uri: lb://COURSE-SERVICE
              predicates:
                 - Path=/api/v1/courses/**,/api/v1/sections/**,/api/v1/lessons/**,/api/v1/categories/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/